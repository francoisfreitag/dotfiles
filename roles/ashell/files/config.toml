[modules]
left = ["Workspaces"]
center = [["Tempo", "Notifications"], ["NextMeeting"], ["Privacy"]]
right = [["SystemInfo"], ["Tray"], ["Settings"]]

[settings]
indicators = ["IdleInhibitor", "Audio", "Bluetooth", "Network", "Vpn", "Battery"]
shutdown_cmd = "systemctl poweroff"

[[CustomModule]]
name = "NextMeeting"
type = "Button"
command = "~/.local/bin/ashell-next-meeting action"
listen_cmd = """
while true; do
	~/.local/bin/ashell-next-meeting monitor
	sleep 300
done
"""
icon = ""
alert = "UPCOMING"
icons.'STARTED' = "󰻗"
icons.'UPCOMING' = "󱙭"
icons.'EMPTY' = ""

[window_title]
truncate_title_after_length = 120

[appearance]
font_name = "FiraCode Nerd Font"
scale_factor = 1.0

# https://malpenzibo.github.io/ashell/docs/configuration/appearance/theme#catppuccin-mocha
success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"
