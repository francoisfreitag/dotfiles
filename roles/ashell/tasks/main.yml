---
- name: Configuration directory exists
  file:
    path: ~/.config/ashell
    state: directory

- name: Configure
  file:
    src: "{{ role_path }}/files/config.toml"
    dest: ~/.config/ashell/config.toml
    state: link

- name: Enable systemd unit
  systemd_service:
    name: ashell
    state: started
    enabled: true
    scope: user

- name: Install NextMeeting script
  file:
    src: "{{ role_path }}/files/ashell_next_meeting"
    dest: ~/.local/bin/ashell-next-meeting
    state: link
