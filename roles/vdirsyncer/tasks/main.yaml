---
- name: Deactivate vdirsyncer
  systemd_service:
    name: vdirsyncer.timer
    scope: user
    enabled: no
    state: stopped

- name: Remove vdirsyncer config
  file:
    path: ~/.config/vdirsyncer/config
    state: absent

- name: Remove configuration directory
  file:
    path: ~/.config/vdirsyncer
    state: absent
